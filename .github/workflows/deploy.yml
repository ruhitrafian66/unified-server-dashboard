name: CI / CD

# ─────────────────────────────────────────────────────────────────────────────
# Pull-based deployment for a LAN-only self-hosted server.
#
# The dashboard server is NOT reachable from the internet (SSH ports closed),
# so GitHub Actions cannot push to it. Instead:
#   - CI builds & validates every change.
#   - When the build is green on `master`, the `release` job advances a rolling
#     "deploy-ready" tag and publishes a GitHub Release.
#   - The server runs a systemd timer that polls `deploy-ready` (via outbound
#     `git fetch`) and redeploys only when it moves. NO inbound ports required.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to release/deploy
        required: true
        default: master

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# The rolling tag the server watches. Kept in one place for clarity.
env:
  DEPLOY_TAG: deploy-ready

jobs:
  # ─── CI: validate the change is buildable before anything else ───────────
  ci:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify built artifacts exist
        run: |
          test -f frontend/dist/index.html || { echo "frontend/dist/index.html missing"; exit 1; }
          echo "Frontend build artifacts OK"

      - name: Smoke-test backend (boot in production mode and probe it)
        run: |
          export DATA_DIR="$RUNNER_TEMP/data" PORT=3999 NODE_ENV=production QBITTORRENT_URL=http://127.0.0.1:9
          node backend/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 20); do curl -fsS localhost:3999/api/health >/dev/null 2>&1 && break; sleep 0.5; done
          set -x
          curl -fsS localhost:3999/api/health | grep -q '"status":"ok"'
          curl -fsS localhost:3999/ | grep -q '<div id="root">'
          curl -fsS localhost:3999/api/shows | grep -q '"shows"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3999/api/shows/check)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3999/api/does-not-exist)" = 404
          kill %1
        # Print the server log if anything above failed.
      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

      - name: Upload build artifact (consumed by the release job)
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  # ─── CD: only green builds get marked deployable ─────────────────────────
  release:
    name: Mark deploy-ready (rolling tag + release)
    needs: ci
    # Only on push to the main branch, or manual dispatch. Never from PRs.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Download built frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Advance the deploy-ready tag to this commit
        # Force a moving tag so the server's poll sees a new marker when this
        # commit is a green build. This is the only signal the server needs.
        # GitHub occasionally answers 500 on ref updates; one such failure once
        # left the server 2 commits behind for days. Retry with back-off.
        run: |
          git tag -f "${DEPLOY_TAG}"
          for attempt in 1 2 3 4 5; do
            git push --force origin "refs/tags/${DEPLOY_TAG}" && exit 0
            echo "Tag push failed (attempt $attempt); retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Publish / update GitHub Release for the deploy-ready tag
        # A rolling release: re-running updates the same release rather than
        # accumulating one per deploy. The built frontend is attached so you
        # can grab a known-good build for manual rollback.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DEPLOY_TAG }}
          name: Deploy-ready build
          body: |
            Latest build that passed CI on `${{ github.ref_name }}`.
            Auto-built from commit `${{ github.sha }}`.
            The server auto-deploys when this tag moves.
          files: frontend/dist/**
          draft: false
          prerelease: false
